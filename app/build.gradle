plugins { id 'com.android.application' }
android {
    namespace 'cn.quietstart'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.quietstart'
        minSdk 33
        targetSdk 35
        versionCode 8
        versionName '0.3.2'
        testInstrumentationRunner 'cn.quietstart.IdleWaitInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
